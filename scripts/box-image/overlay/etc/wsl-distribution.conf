# O nome registrado vem daqui, não de flag de linha de comando (ADR-0007), e é
# o que faz o duplo-clique no arquivo .wsl funcionar. O OOBE cria o usuário
# humano (ponto 3: a caixa é dele tanto quanto dos agentes); o agente nunca é o
# usuário padrão — o runtime entra com `-u haneagent` de forma explícita.

[oobe]
command = /etc/hane-oobe.sh
defaultUid = 1000
defaultName = hane

[shortcut]
enabled = true
