# A fronteira da caixa nasce aqui, não depois da instalação (ADR-0007).
# Sem automount, C: e A: não existem lá dentro; sem interop, nenhum .exe do
# Windows é alcançável de dentro; nenhum binário Windows no PATH.

[boot]
systemd = false

[automount]
enabled = false

[interop]
enabled = false
appendWindowsPath = false
