name: Verify

# The green number has to be reproducible from a clean clone, so the job builds the
# prototype before testing it: work/mission-ui-prototype/tests/sites-worker.test.mjs
# asserts the packaging artifacts exist, and `dist/` is gitignored.
# Two Node versions are measured on purpose: the floor `package.json` promises and the
# LTS the developers actually run. `node:sqlite` availability is the difference between
# them, and that claim belongs to CI, not to a comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows because this is the platform the product targets (Credential Manager, WSL
    # sandbox) and the only platform where this suite has been measured green.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            work/mission-ui-prototype/package-lock.json

      # Measured on the first run of this workflow: npm 10, which ships with Node 22,
      # runs every install script, and argon2's is a node-gyp build that node-gyp 11
      # cannot configure on the runner ("gyp ERR! find VS: unknown version "undefined"
      # found at C:\Program Files\Microsoft Visual Studio\18\Enterprise"). npm 11 leaves
      # that script unapproved and argon2 loads its bundled NAPI binary instead — the
      # 24.x leg ran green that way. One installer for both legs keeps the floor a claim
      # about the runtime API, not about whether CI can compile a native module.
      - name: Use one installer for both Node legs
        run: npm install --global npm@11

      - name: Install the runtime dependencies
        run: npm ci

      - name: Install the prototype dependencies
        working-directory: work/mission-ui-prototype
        run: npm ci

      - name: Build the prototype
        working-directory: work/mission-ui-prototype
        run: npm run build

      - name: Syntax check and test suite
        run: npm run verify

      - name: Prototype suite on its own entry point
        working-directory: work/mission-ui-prototype
        run: npm run test:sites
